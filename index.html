<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>تس‌ت خخخ</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 800px;
    margin: 70px auto;
    padding: 40px 25px;
    background: #1b1b1b;
    border-radius: 25px;
    text-align: center;
    box-shadow:
        0 15px 50px
        rgba(0,0,0,.4);
}

h1 {
    color: #00C853;
    font-size: 42px;
    margin-bottom: 25px;
}

p {
    font-size: 19px;
    line-height: 2;
    white-space: pre-wrap;
}

.btn {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 15px auto;
    padding: 16px;
    border-radius: 14px;
    background: #00C853;
    color: #000;
    text-decoration: none;
    font-weight: bold;
    transition: .2s;
}

.btn:hover {
    transform: scale(1.03);
}

.footer {
    margin-top: 30px;
    opacity: .5;
    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

<h1>تس‌ت خخخ</h1>

<p>تست خخخ نگا تس‌ت رو اینجوری میگم خخخ عههههخخخ خخخخخ تس‌ت</p>


<a class="btn"
href="https://example.com/?copy=تست"
target="_blank"
rel="noopener noreferrer">
کپی تست
</a>


<div class="footer">
ساخته شده با ربات سایت‌ساز
</div>

</div>

</body>

</html>
